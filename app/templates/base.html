<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Expenso{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/static/app.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7"></script>
    {% block head %}{% endblock %}
</head>
<body>
    {% set current_path = request.url.path %}
    <nav class="nav" id="site-nav" aria-label="Main">
        <div class="container nav-inner">
            <a href="/month/{{ now_year }}/{{ now_month }}" class="wordmark">Expenso</a>
            <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="nav-links"
                    aria-label="Menu" onclick="toggleNav(this)">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
            <div class="nav-links" id="nav-links">
                <a href="/month/{{ now_year }}/{{ now_month }}" {% if current_path.startswith('/month/') %}aria-current="page"{% endif %}>Month</a>
                <a href="/year/{{ now_year }}" {% if current_path.startswith('/year/') %}aria-current="page"{% endif %}>Year</a>
                <a href="/transactions" {% if current_path.startswith('/transactions') %}aria-current="page"{% endif %}>Transactions</a>
                <a href="/review" {% if current_path.startswith('/review') %}aria-current="page"{% endif %}>Review</a>
                <a href="/ask" {% if current_path.startswith('/ask') %}aria-current="page"{% endif %}>Ask</a>
            </div>
        </div>
    </nav>

    <main class="container {% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    {% block footer %}
    <footer class="footer">
        <div class="container">
            Expenso &middot; Personal finance tracker &middot; <a href="/pipeline">Data status</a>
        </div>
    </footer>
    {% endblock %}

    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

<!-- Single transaction row — returned by POST /htmx/update-category for outerHTML swap -->
<div class="flex items-center justify-between px-6 py-4 hover:bg-gray-50 transition-colors"
     id="txn-{{ txn.ref }}">
    <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-full flex-shrink-0 flex items-center justify-center text-white text-sm font-bold"
             style="background-color: {{ txn.categoryColor }}">
            {{ txn.merchant[0] | upper }}
        </div>
        <div class="min-w-0">
            <p class="text-sm font-medium text-gray-900 truncate">{{ txn.merchant }}</p>
            <div class="flex items-center gap-2 mt-0.5">
                <!-- Click-to-edit category badge -->
                <div class="relative inline-block category-editor">
                    <button class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium text-white cursor-pointer hover:opacity-80 transition-opacity"
                            style="background-color: {{ txn.categoryColor }}"
                            onclick="toggleCategoryDropdown(this)">
                        {{ txn.category }}
                        <svg class="w-3 h-3 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>
                    <!-- Category dropdown -->
                    <div class="category-dropdown hidden absolute left-0 top-full mt-1 z-50 bg-white rounded-lg shadow-lg border border-gray-200 py-1 w-48">
                        {% for cat in categoryOptions %}
                        <button class="w-full text-left px-3 py-1.5 text-xs hover:bg-gray-50 flex items-center gap-2
                                      {% if cat.name == txn.category %}font-semibold bg-gray-50{% endif %}"
                                hx-post="/htmx/update-category"
                                hx-vals='{"ref": "{{ txn.ref }}", "category": "{{ cat.name }}"}'
                                hx-target="#txn-{{ txn.ref }}"
                                hx-swap="outerHTML">
                            <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color: {{ cat.color }}"></span>
                            {{ cat.name }}
                            {% if cat.name == txn.category %}
                            <svg class="w-3 h-3 ml-auto text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                            </svg>
                            {% endif %}
                        </button>
                        {% endfor %}
                    </div>
                </div>
                <span class="text-xs text-gray-400">{{ txn.date }}</span>
            </div>
        </div>
    </div>
    <span class="text-sm font-semibold whitespace-nowrap ml-4
                 {% if txn.isIncome %}text-green-600{% else %}text-gray-900{% endif %}">
        {{ txn.amount }}
    </span>
</div>

<div class="txn-row" id="txn-{{ txn.ref }}">
    <span class="avatar" aria-hidden="true">{{ txn.merchant[0] | upper }}</span>
    <div class="txn-main">
        <p class="classification-error" role="alert"></p>
        <p class="txn-merchant">{{ txn.merchant }}</p>
        <div class="txn-meta">
            <div class="category-editor">
                <button type="button" class="cat-button"
                        aria-expanded="false" aria-controls="category-menu-{{ txn.ref }}"
                        aria-label="Category: {{ txn.category }}. Change category"
                        onclick="toggleCategoryDropdown(this)">
                    <span class="dot" style="background: {{ txn.categoryColor }}"></span>
                    {{ txn.category }}
                    <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                </button>
                <div id="category-menu-{{ txn.ref }}" role="group" aria-label="Choose category" class="category-dropdown hidden">
                    {% if not txn.isIncome %}
                    <label>
                        <input type="checkbox" name="learn_merchant" value="true">
                        {% if txn.similarCount %}
                        <span>Use for all payments to this merchant <span class="hint">Updates {{ txn.similarCount }} other {{ "payment" if txn.similarCount == 1 else "payments" }} and future ones. Your own edits stay.</span></span>
                        {% else %}
                        <span>Use for all payments to this merchant <span class="hint">Applies to future payments.</span></span>
                        {% endif %}
                    </label>
                    {% endif %}
                    {% for cat in categoryOptions %}
                    <button type="button" class="cat-option {% if cat.name == txn.category %}is-current{% endif %}"
                            hx-post="/htmx/update-category"
                            hx-include="closest .category-editor"
                            hx-vals='{"ref": "{{ txn.ref }}", "category": "{{ cat.name }}"}'
                            hx-target="#txn-{{ txn.ref }}"
                            hx-swap="outerHTML">
                        <span class="dot" style="background: {{ cat.color }}"></span>
                        {{ cat.name }}
                        {% if cat.name == txn.category %}
                        <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                        {% endif %}
                    </button>
                    {% endfor %}
                </div>
            </div>
            {% if txn.needsReview %}<span class="tag-review">Needs review</span>{% endif %}
            <span>{{ txn.date }}</span>
            {% if txn.editId %}
            <button type="button" class="link-button" hx-post="/htmx/undo-category"
                    hx-vals='{"edit_id": {{ txn.editId }}}' hx-target="#txn-{{ txn.ref }}" hx-swap="outerHTML">Undo</button>
            {% endif %}
        </div>
    </div>
    <span class="amount num {% if txn.isIncome %}is-in{% endif %}">{{ txn.amount }}</span>
</div>

[project]
name = "expenso"
version = "0.1.0"
description = ""
authors = [
    {name = "Vinaysankeerth13", email = "vinaysankeerth1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"

# Runtime dependencies (add/remove as you like)
dependencies = [
    "fastapi (>=0.116.2,<1.0.0)",
    "uvicorn (>=0.20.0,<1.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "google-api-python-client (>=2.182.0,<3.0.0)",
    "google-auth-httplib2 (>=0.2.0,<0.3.0)",
    "google-auth-oauthlib (>=1.2.2,<2.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "anthropic (>=0.83.0,<0.84.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)"
]

[tool.poetry]
# This is an application (run in place via `poetry run python app/...`), not a
# distributable library — don't try to build/install "expenso" as a package.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)",
    "isort (>=6.0.1,<7.0.0)"
]
